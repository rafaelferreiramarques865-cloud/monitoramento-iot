<!DOCTYPE html> 
<html lang="pt-BR"> 
 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
  <title>Dashboard IoT</title> 
 
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display
=swap" rel="stylesheet"> 
 
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
 
  <style> 
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    } 
 
    body { 
      font-family: 'Inter', Arial, sans-serif; 
      background: #0f172a; 
      min-height: 100vh; 
      padding: 32px 20px; 
      color: #e2e8f0; 
    } 
 
    /* fundo com gradiente sutil */ 
    body::before { 
      content: ''; 
      position: fixed; 
      inset: 0; 
      background: 
        radial-gradient(ellipse 80% 50% at 20% 10%, #1e3a5f44 0%, transparent 
60%), 
        radial-gradient(ellipse 60% 40% at 80% 80%, #1e1b4b33 0%, transparent 
60%); 
      pointer-events: none; 
      z-index: 0; 
    } 
 
    .container { 
      max-width: 1000px; 
      margin: auto; 
      position: relative; 
      z-index: 1; 
    } 
 
    /* ── HEADER ── */ 
    header { 
      text-align: center; 
      margin-bottom: 36px; 
    } 
 
    header h1 { 
      font-size: 1.75rem; 
      font-weight: 700; 
      letter-spacing: -0.5px; 
      background: linear-gradient(135deg, #60a5fa, #a78bfa); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      background-clip: text; 
    } 
 
    header p { 
      margin-top: 6px; 
      font-size: 0.875rem; 
      color: #64748b; 
      font-weight: 500; 
      letter-spacing: 0.5px; 
      text-transform: uppercase; 
    } 
 
    /* ── STATUS ── */ 
    .status { 
      text-align: center; 
      font-size: 0.8rem; 
      color: #475569; 
      margin-bottom: 28px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    } 
 
    .status::before { 
      content: ''; 
      display: inline-block; 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: #22c55e; 
      box-shadow: 0 0 6px #22c55e99; 
      animation: pulse 2s ease-in-out infinite; 
      flex-shrink: 0; 
    } 
 
    @keyframes pulse { 
      0%, 100% { opacity: 1; transform: scale(1); } 
      50%       { opacity: 0.5; transform: scale(0.85); } 
    } 
 
    /* ── CARDS ── */ 
    .cards { 
      display: flex; 
      gap: 20px; 
      flex-wrap: wrap; 
    } 
 
    .card { 
      background: #1e293b; 
      border: 1px solid #334155; 
      padding: 28px 24px; 
      border-radius: 16px; 
      flex: 1; 
      min-width: 200px; 
      text-align: center; 
      box-shadow: 0 4px 24px #00000040; 
      position: relative; 
      overflow: hidden; 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
    } 
 
    .card:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 8px 32px #00000060; 
    } 
 
    /* barra colorida no topo do card */ 
    .card::before { 
      content: ''; 
      position: absolute; 
      top: 0; left: 0; right: 0; 
      height: 3px; 
      border-radius: 16px 16px 0 0; 
    } 
 
    .card-temp::before { background: linear-gradient(90deg, #f97316, #fb923c); } 
    .card-umid::before { background: linear-gradient(90deg, #38bdf8, #60a5fa); } 
 
    .card-icon { 
      font-size: 2rem; 
      margin-bottom: 10px; 
      line-height: 1; 
    } 
 
    .card h3 { 
      font-size: 0.75rem; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      color: #64748b; 
      margin-bottom: 10px; 
    } 
 
    .valor { 
      font-size: 3rem; 
      font-weight: 700; 
      letter-spacing: -1px; 
      transition: color 0.4s ease; 
    } 
 
    .card-temp .valor { color: #fb923c; } 
    .card-umid .valor { color: #38bdf8; } 
 
    /* ── GRÁFICO ── */ 
    .grafico { 
      background: #1e293b; 
      border: 1px solid #334155; 
      padding: 24px; 
      border-radius: 16px; 
      margin-top: 24px; 
      box-shadow: 0 4px 24px #00000040; 
    } 
 
    .grafico h3 { 
      font-size: 0.75rem; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      color: #64748b; 
      margin-bottom: 20px; 
    } 
  </style> 
</head> 
 
<body> 
 
<div class="container"> 
 
  <header> 
    <h1>Monitoramento Ambiental IoT</h1> 
    <p>Estação de monitoramento com ESP32</p> 
  </header> 
 
  <div class="status" id="status"> 
    Aguardando dados... 
  </div> 
 
  <div class="cards"> 
 
    <div class="card card-temp"> 
      <div class="card-icon">🌡️</div> 
      <h3>Temperatura</h3> 
      <div class="valor" id="temperatura">-- °C</div> 
    </div> 
 
    <div class="card card-umid"> 
      <div class="card-icon">💧</div> 
      <h3>Umidade</h3> 
      <div class="valor" id="umidade">-- %</div> 
    </div> 
 
  </div> 
 
  <div class="grafico"> 
    <h3>Histórico de temperatura</h3> 
    <canvas id="grafico"></canvas> 
  </div> 
 
</div> 
 
<script> 
 
  // CONFIGURAR GRÁFICO 
  const grafico = new Chart( 
    document.getElementById("grafico"), 
    { 
      type: "line", 
 
      data: { 
        labels: [], 
 
        datasets: [{ 
          label: "Temperatura (°C)", 
          data: [], 
          borderWidth: 2, 
          tension: 0.3, 
          borderColor: "#fb923c", 
          backgroundColor: "rgba(249,115,22,0.08)", 
          pointBackgroundColor: "#fb923c", 
          pointBorderColor: "#1e293b", 
          pointBorderWidth: 2, 
          pointRadius: 4, 
          fill: true 
        }] 
      }, 
 
      options: { 
        responsive: true, 
        plugins: { 
          legend: { 
            labels: { 
              color: "#94a3b8", 
              font: { family: "'Inter', Arial, sans-serif", size: 12 } 
            } 
          } 
        }, 
        scales: { 
          x: { 
            ticks: { color: "#475569", font: { size: 11 } }, 
            grid:  { color: "#1e3a5f55" } 
          }, 
          y: { 
            ticks: { color: "#475569", font: { size: 11 } }, 
            grid:  { color: "#1e3a5f55" } 
          } 
        } 
      } 
    } 
  ); 
 
  // BUSCAR DADOS DO SERVIDOR 
  async function atualizarDashboard() { 
 
    try { 
 
      const resposta = await fetch("/api/historico"); 
 
      const dados = await resposta.json(); 
 
      if (dados.length === 0) { 
        return; 
      } 
 
      // ÚLTIMA LEITURA 
      const atual = dados[dados.length - 1]; 
 
      // ATUALIZAR INDICADORES 
      document.getElementById("temperatura") 
        .innerText = atual.temperatura + " °C"; 
 
      document.getElementById("umidade") 
        .innerText = atual.umidade + " %"; 
 
      document.getElementById("status") 
        .innerText = 
        "Dispositivo: " + atual.dispositivo + 
        " | Atualizado: " + 
        new Date(atual.horario).toLocaleTimeString(); 
 
      // ATUALIZAR GRÁFICO 
      grafico.data.labels = dados.map( 
        item => new Date(item.horario) 
          .toLocaleTimeString() 
      ); 
 
      grafico.data.datasets[0].data = 
        dados.map(item => item.temperatura); 
 
      grafico.update(); 
 
    } catch (erro) { 
 
      document.getElementById("status") 
        .innerText = "Erro ao receber dados do servidor."; 
 
      console.log(erro); 
    } 
  } 
 
  // ATUALIZAR A CADA 3 SEGUNDOS 
  setInterval(atualizarDashboard, 3000); 
 
  atualizarDashboard(); 
 
</script> 
 
</body> 
</html>
